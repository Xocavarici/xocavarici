<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22b14c">
<meta name="robots" content="noindex,nofollow">
<title>Xocavar İçi — Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--g:#22b14c;--g2:#199a3d;--gl:#e8f7ec;--tx:#0f172a;--mut:#64748b;--bd:#e5e7eb;--soft:#f1f5f9;--red:#e11d48;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sh:0 4px 16px rgba(15,23,42,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:#f6f8f7}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;width:100%;padding:13px 15px;border:1.5px solid var(--bd);border-radius:14px;font-size:16px;outline:none;background:#fff;color:var(--tx)}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{resize:vertical;min-height:100px}
.hide{display:none!important}
.lg{width:40px;height:35px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;line-height:1.1}
.logo small{display:block;font-weight:600;color:var(--mut);font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;font-weight:700;font-size:16px;padding:13px 20px;border-radius:999px;text-align:center;width:100%;text-decoration:none}
.btn:active{background:var(--g2)}.btn[disabled]{opacity:.5}
.btn.red{background:#fee2e2;color:var(--red)}.btn.ghost{background:var(--soft);color:var(--tx)}.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.err{color:var(--red);font-size:14px;margin:0}.err:empty{display:none}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#334155}
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eaf8ee,#fff)}
#login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
#login .logo{justify-content:center;font-size:28px;margin-bottom:4px}#login p.sub{text-align:center;color:var(--mut);margin:0 0 8px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:calc(10px + var(--sat)) 16px 0}
.hrow{display:flex;align-items:center;justify-content:space-between;max-width:820px;margin:0 auto;padding-bottom:8px}
.out{font-weight:700;color:var(--red);font-size:14px}
.tabs{display:flex;gap:2px;max-width:820px;margin:0 auto;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:12px 14px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g);border-color:var(--g)}
.dot{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:6px;padding:0 5px}
main{max-width:820px;margin:0 auto;padding:16px 16px calc(30px + var(--sab));display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.chips button{background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;white-space:nowrap;box-shadow:var(--sh)}.chips button.on{background:var(--g);color:#fff}
.card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);display:block;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--gl);color:#15803d;white-space:nowrap}.st.r{background:#fee2e2;color:var(--red)}.st.p{background:#fef3c7;color:#92400e}.st.d{background:#e0e7ff;color:#3730a3}
.meta{color:var(--mut);font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f1f1f1;font-size:15px}.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right;word-break:break-word}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh)}.stat b{display:block;font-size:30px;font-weight:800;color:var(--g2)}.stat span{color:var(--mut);font-size:14px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--g2);padding:4px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.li{display:flex;gap:12px;align-items:center}.li img,.li .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#eef2f1;flex:none}.li>div{flex:1;min-width:0}.li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chat{background:#fff;border-radius:18px;height:calc(100dvh - 330px);min-height:280px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh)}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.35;white-space:pre-wrap;word-break:break-word}.msg small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.msg.a{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:6px}.msg.u{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.cform{display:flex;gap:10px}.cform .btn{width:auto;padding:0 22px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:18px;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.prev{border-radius:18px;overflow:hidden;box-shadow:var(--sh);background:#fff}.prev .h{padding:14px 16px;color:#fff;background:linear-gradient(135deg,#1fae4a,#0b6b27)}.prev .h.update{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.prev .h.promo{background:linear-gradient(135deg,#f59e0b,#d97706)}.prev .h.warning{background:linear-gradient(135deg,#ef4444,#991b1b)}.prev .h b{font-size:18px}.prev .bd{padding:14px 16px;white-space:pre-wrap;line-height:1.5}
.chk{display:flex;align-items:center;gap:10px;flex-direction:row;font-weight:600}.chk input{width:22px;height:22px;accent-color:var(--g)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fdc6c"/><stop offset="1" stop-color="#169637"/></linearGradient><symbol id="logo" viewBox="0 0 64 56"><polygon fill="url(#lg)" points="2,2 18,2 32,22 46,2 62,2 40,28 62,54 46,54 32,34 18,54 2,54 24,28"/></symbol></defs></svg>
<div id="boot" style="position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:100"><svg class="lg" style="width:80px;height:70px"><use href="#logo"/></svg></div>

<section id="login" class="hide">
  <form id="lf">
    <div class="logo"><svg class="lg"><use href="#logo"/></svg>Xocavar İçi</div>
    <p class="sub">Admin paneli</p>
    <label>E-poçt<input type="email" id="le" required autocomplete="username"></label>
    <label>Şifrə<input type="password" id="lp" required autocomplete="current-password"></label>
    <p class="err" id="lerr"></p>
    <button class="btn" id="lb">Daxil ol</button>
  </form>
</section>

<div id="panel" class="hide">
  <header>
    <div class="hrow"><div class="logo"><svg class="lg"><use href="#logo"/></svg><div>Admin<small id="who"></small></div></div><button class="out" id="logout">Çıxış</button></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { ref, onValue, get, set, update, push, remove, runTransaction, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmtT = t => { if (!t) return ""; const d = new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => Number(n || 0).toFixed(2);
let tt; const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2800); };
const ERR = { "auth/invalid-credential": "E-poçt və ya şifrə yanlışdır.", "auth/wrong-password": "E-poçt və ya şifrə yanlışdır.", "auth/user-not-found": "Hesab tapılmadı.", "auth/invalid-email": "E-poçt düzgün deyil.", "auth/too-many-requests": "Çox cəhd edildi. Bir az sonra yenidən yoxlayın.", "auth/network-request-failed": "İnternet bağlantısı yoxdur." };
const CATS = { bike: "Velosiped", frame: "Çərçivə", gear: "Sürət ötürücü", brake: "Tormuz", light: "İşıq", lock: "Kilid/aksesuar", other: "Digər" };
const KIND = { info: "Məlumat", update: "Yenilik", promo: "Kampaniya", warning: "Diqqət" };
const TABS = [["home", "Ümumi"], ["listings", "Elanlar"], ["users", "İstifadəçilər"], ["promo", "Promokodlar"], ["notify", "Bildiriş"], ["support", "Dəstək"], ["settings", "Ayarlar"]];

const S = { tab: "home", view: null, uid: null, unsubs: [], chatUn: null, users: {}, wallets: {}, listings: {}, promos: {}, anns: {}, sup: {}, cfg: {}, lf: "all", lq: "", uq: "", off: 0 };
const now = () => Date.now() + S.off;

/* ----- Giriş ----- */
$("#lf").addEventListener("submit", async e => {
  e.preventDefault(); $("#lb").disabled = true; $("#lerr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#le").value.trim(), $("#lp").value); }
  catch (er) { $("#lerr").textContent = ERR[er.code] || "Giriş alınmadı. Yenidən cəhd edin."; }
  $("#lb").disabled = false;
});
$("#logout").addEventListener("click", () => signOut(auth));
let denied = false;
onAuthStateChanged(auth, async u => {
  $("#boot").classList.add("hide");
  S.unsubs.forEach(f => f()); S.unsubs = []; if (S.chatUn) { S.chatUn(); S.chatUn = null; }
  if (!u) {
    S.uid = null; $("#panel").classList.add("hide"); $("#login").classList.remove("hide");
    if (denied) { $("#lerr").textContent = "Bu hesabın admin girişinə icazəsi yoxdur."; denied = false; }
    return;
  }
  let ok = false;
  try { ok = (await get(ref(db, `admins/${u.uid}`))).val() === true; } catch (e) { ok = false; }
  if (!ok) { denied = true; await signOut(auth); return; }
  S.uid = u.uid; $("#who").textContent = u.email;
  $("#login").classList.add("hide"); $("#panel").classList.remove("hide");
  const L = (path, key, post) => S.unsubs.push(onValue(typeof path === "string" ? ref(db, path) : path, s => { S[key] = s.val() || {}; if (post) post(); paint(); }, () => toast(key + " yüklənmədi.")));
  S.unsubs.push(onValue(ref(db, ".info/serverTimeOffset"), s => { S.off = s.val() || 0; }));
  L("users", "users"); L("wallets", "wallets"); L(query(ref(db, "listings"), limitToLast(300)), "listings");
  L("promo_codes", "promos"); L(query(ref(db, "announcements"), limitToLast(60)), "anns");
  L("config", "cfg");
  S.unsubs.push(onValue(ref(db, "support"), s => {
    const v = s.val() || {}; S.sup = {}; Object.entries(v).forEach(([id, x]) => { S.sup[id] = x.meta || {}; }); paint();
  }, () => toast("Dəstək söhbətləri yüklənmədi.")));
  drawTabs(); render();
});

function drawTabs() {
  $("#tabs").innerHTML = TABS.map(([k, n]) => `<button data-t="${k}" class="${S.tab === k ? "on" : ""}">${n}<span class="dot hide" id="d_${k}"></span></button>`).join("");
  $$("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.view = null; if (S.chatUn) { S.chatUn(); S.chatUn = null; } $$("#tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); });
  paintDots();
}
function paintDots() {
  const n = Object.values(S.sup).filter(m => m.unreadAdmin === true).length, d = $("#d_support");
  if (d) { d.textContent = n; d.classList.toggle("hide", !n); }
}
/* canlı yeniləmə: yazı yazılan formaları pozmamaq üçün yalnız siyahı hissələri yenilənir */
function paint() {
  paintDots();
  const f = { home: homeView, listings: () => $("#lres") && listRes(), users: () => $("#ures") && userRes(), promo: () => $("#pres") && promoRes(), notify: () => $("#nres") && notifyRes(), support: () => !S.view && supView() }[S.tab];
  if (S.tab === "users" && S.view) { const b = $("#abal"); if (b) b.textContent = money((S.wallets[S.view] || {}).balance); return; }
  if (S.tab === "home") { homeView(); return; }
  if (f) f();
}
function render() { ({ home: homeView, listings: listingsView, users: usersView, promo: promoView, notify: notifyView, support: supView, settings: settingsView }[S.tab])(); }
const main = h => { $("#main").innerHTML = h; };

/* ----- Ümumi ----- */
function homeView() {
  if (S.tab !== "home") return;
  const L = Object.values(S.listings), act = L.filter(l => l.status === "active" && !l.blocked).length;
  const tot = Object.values(S.wallets).reduce((a, w) => a + (Number(w.balance) || 0), 0);
  const uc = Object.keys(S.users).length, pr = Object.values(S.promos).filter(p => p.active).length, su = Object.values(S.sup).filter(m => m.unreadAdmin === true).length;
  main(`<div class="stats"><div class="stat"><b>${uc}</b><span>İstifadəçi</span></div><div class="stat"><b>${act}</b><span>Aktiv elan (${L.length} ümumi)</span></div>
  <div class="stat"><b>${money(tot)}</b><span>Dövriyyədəki AV</span></div><div class="stat"><b>${pr}</b><span>Aktiv promokod</span></div>
  <div class="stat"><b>${su}</b><span>Oxunmamış dəstək</span></div><div class="stat"><b>${L.filter(l => l.boostedUntil > now()).length}</b><span>VIP elan</span></div></div>
  <div class="card"><b>Son elanlar</b>${L.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5).map(l => `<div class="kv"><span>${esc(l.title)}</span><b>${esc(l.sellerName || "")}</b></div>`).join("") || '<p class="meta">Hələ elan yoxdur.</p>'}</div>`);
}

/* ----- Elanlar ----- */
function listingsView() {
  const F = [["all", "Hamısı"], ["active", "Aktiv"], ["sold", "Satılıb"], ["hidden", "Gizli"], ["blocked", "Bloklu"]];
  main(`<input id="lqi" placeholder="Başlıq və ya satıcı axtar…" value="${esc(S.lq)}"><div class="chips" id="lfc">${F.map(([k, n]) => `<button data-f="${k}" class="${S.lf === k ? "on" : ""}">${n}</button>`).join("")}</div><div id="lres" style="display:flex;flex-direction:column;gap:10px"></div>`);
  $("#lqi").oninput = e => { S.lq = e.target.value.toLowerCase(); listRes(); };
  $("#lfc").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.lf = b.dataset.f; $$("#lfc button").forEach(x => x.classList.toggle("on", x === b)); listRes(); };
  listRes();
}
function listRes() {
  let a = Object.entries(S.listings).sort((x, y) => (y[1].createdAt || 0) - (x[1].createdAt || 0));
  if (S.lf === "blocked") a = a.filter(([, l]) => l.blocked); else if (S.lf !== "all") a = a.filter(([, l]) => l.status === S.lf && !l.blocked);
  if (S.lq) a = a.filter(([, l]) => (l.title + " " + (l.sellerName || "")).toLowerCase().includes(S.lq));
  $("#lres").innerHTML = a.length ? a.map(([id, l]) => `<div class="card"><div class="li">${l.thumb ? `<img src="${l.thumb}" alt="">` : '<div class="ph"></div>'}<div><b>${esc(l.title)}</b><span class="meta">${money(l.price)} ₼ · ${esc(CATS[l.category] || "")} · ${esc(l.city || "")}</span><br><span class="meta">${esc(l.sellerName || "")} · ${fmtT(l.createdAt)}</span></div>
  <span class="st ${l.blocked ? "r" : l.status === "sold" ? "d" : l.status === "hidden" ? "p" : ""}">${l.blocked ? "Bloklu" : l.status === "sold" ? "Satılıb" : l.status === "hidden" ? "Gizli" : "Aktiv"}</span></div>
  <div class="acts"><button class="btn sm ${l.blocked ? "" : "red"}" data-a="block" data-id="${esc(id)}">${l.blocked ? "Blokdan çıxar" : "Blokla"}</button><button class="btn sm ghost" data-a="vip" data-id="${esc(id)}">${l.boostedUntil > now() ? "VIP-i götür" : "VIP ver (3 gün)"}</button><button class="btn sm red" data-a="del" data-id="${esc(id)}">Sil</button></div></div>`).join("") : '<div class="empty">Elan tapılmadı.</div>';
  $$("#lres [data-a]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, l = S.listings[id]; if (!l) return;
    try {
      if (b.dataset.a === "block") { await update(ref(db, `listings/${id}`), { blocked: l.blocked ? null : true }); toast(l.blocked ? "Blokdan çıxarıldı." : "Elan bloklandı."); }
      else if (b.dataset.a === "vip") { await update(ref(db, `listings/${id}`), { boostedUntil: l.boostedUntil > now() ? null : Math.round(now() + 3 * 86400000) }); toast("Yeniləndi."); }
      else if (confirm("Elan həmişəlik silinsin?")) { await update(ref(db), { [`listings/${id}`]: null, [`listing_photos/${id}`]: null }); toast("Elan silindi."); }
    } catch (e) { toast("Əməliyyat alınmadı."); }
  });
}

/* ----- İstifadəçilər və AV ----- */
function usersView() {
  if (S.view) return userDetail(S.view);
  main(`<input id="uqi" placeholder="Ad, e-poçt və ya telefon axtar…" value="${esc(S.uq)}"><div id="ures" style="display:flex;flex-direction:column;gap:10px"></div>`);
  $("#uqi").oninput = e => { S.uq = e.target.value.toLowerCase(); userRes(); };
  userRes();
}
function userRes() {
  let a = Object.entries(S.users).sort((x, y) => (y[1].createdAt || 0) - (x[1].createdAt || 0));
  if (S.uq) a = a.filter(([, u]) => ((u.name || "") + " " + (u.email || "") + " " + (u.phone || "")).toLowerCase().includes(S.uq));
  $("#ures").innerHTML = a.length ? a.slice(0, 80).map(([id, u]) => `<button class="card" data-id="${esc(id)}"><div class="row"><b>${esc(u.name || "—")}</b><span class="st">${money((S.wallets[id] || {}).balance)} AV</span></div><div class="meta">${esc(u.email || "")} · ${esc(u.phone || "")}</div></button>`).join("") : '<div class="empty">İstifadəçi tapılmadı.</div>';
  $$("#ures .card").forEach(b => b.onclick = () => { S.view = b.dataset.id; usersView(); });
}
function userDetail(uid) {
  const u = S.users[uid] || {}, n = Object.values(S.listings).filter(l => l.uid === uid).length;
  main(`<button class="back" id="bk">‹ Geri</button><div class="card"><b style="font-size:19px">${esc(u.name || "—")}</b>
  <div class="kv"><span>E-poçt</span><b>${esc(u.email || "")}</b></div><div class="kv"><span>Telefon</span><b>${esc(u.phone || "")} ${u.phone ? `<a href="tel:${esc(u.phone)}" style="color:var(--g2)">📞</a>` : ""}</b></div><div class="kv"><span>Şəhər</span><b>${esc(u.city || "—")}</b></div><div class="kv"><span>Elan sayı</span><b>${n}</b></div><div class="kv"><span>Qeydiyyat</span><b>${fmtT(u.createdAt)}</b></div><div class="kv"><span>AV balansı</span><b id="abal" style="color:var(--g2);font-size:18px">${money((S.wallets[uid] || {}).balance)}</b></div></div>
  <div class="card"><b>AV balansını dəyiş</b><form id="af" class="form" style="margin-top:10px"><label>Məbləğ (AV)<input id="am" type="number" step="0.01" min="0.01" inputmode="decimal" required></label><label>Qeyd (istifadəçi görəcək)<input id="an" maxlength="80" placeholder="Məs: Hədiyyə balans"></label><p class="err" id="ae"></p>
  <div class="grid2"><button class="btn" data-s="1">+ Əlavə et</button><button class="btn red" data-s="-1">− Çıxart</button></div></form></div>
  <button class="btn ghost" id="sp">Dəstək söhbətini aç</button>`);
  $("#bk").onclick = () => { S.view = null; usersView(); };
  $("#sp").onclick = () => { S.tab = "support"; S.view = uid; drawTabs(); supView(); };
  let sign = 1; $$("#af [data-s]").forEach(b => b.onclick = () => { sign = +b.dataset.s; });
  $("#af").onsubmit = async e => {
    e.preventDefault(); const amt = parseFloat($("#am").value), note = $("#an").value.trim(), err = $("#ae"); err.textContent = "";
    if (!(amt > 0)) { err.textContent = "Məbləği düzgün yazın."; return; }
    try {
      let bad = false;
      await runTransaction(ref(db, `wallets/${uid}/balance`), c => { c = Number(c || 0); const v = +(c + sign * amt).toFixed(2); if (v < 0) { bad = true; return; } return v; });
      if (bad) { err.textContent = "Balans mənfi ola bilməz."; return; }
      await push(ref(db, `av_tx/${uid}`), { type: "admin", amount: sign * amt, note: note || (sign > 0 ? "İnzibatçı tərəfindən yükləndi" : "İnzibatçı tərəfindən çıxıldı"), ts: serverTimestamp() });
      $("#am").value = ""; toast("Balans yeniləndi.");
    } catch (er) { err.textContent = "Əməliyyat alınmadı."; }
  };
}

/* ----- Promokodlar ----- */
const genCode = () => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 8; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
function promoView() {
  main(`<div class="card"><b>Yeni promokod yarat</b><form id="pf" class="form" style="margin-top:10px"><label>Kod (boş buraxsanız avtomatik yaradılır)<input id="pc" maxlength="20" autocapitalize="characters" placeholder="Məs: YENI50"></label>
  <div class="grid2"><label>AV məbləği<input id="pa" type="number" step="0.01" min="0.01" required inputmode="decimal"></label><label>İstifadə limiti<input id="pm" type="number" min="1" step="1" value="1" required inputmode="numeric"></label></div>
  <label>Bitmə tarixi (istəyə görə)<input id="pe" type="date"></label><p class="err" id="perr"></p><button class="btn">Promokod yarat</button></form></div><div class="meta">Hər istifadəçi eyni kodu yalnız 1 dəfə istifadə edə bilər.</div><div id="pres" style="display:flex;flex-direction:column;gap:10px"></div>`);
  $("#pf").onsubmit = async e => {
    e.preventDefault(); const err = $("#perr"); err.textContent = "";
    const code = ($("#pc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "")) || genCode(), amount = parseFloat($("#pa").value), maxUses = parseInt($("#pm").value, 10), d = $("#pe").value;
    if (!(amount > 0) || !(maxUses >= 1)) { err.textContent = "Məbləğ və limiti düzgün yazın."; return; }
    try {
      if ((await get(ref(db, `promo_codes/${code}`))).exists()) { err.textContent = "Bu kod artıq mövcuddur."; return; }
      await set(ref(db, `promo_codes/${code}`), { amount, maxUses, used: 0, active: true, createdAt: serverTimestamp(), createdBy: S.uid, ...(d ? { expiresAt: new Date(d + "T23:59:59").getTime() } : {}) });
      $("#pc").value = ""; toast("Promokod yaradıldı: " + code);
    } catch (er) { err.textContent = "Yaradıla bilmədi."; }
  };
  promoRes();
}
function promoRes() {
  const a = Object.entries(S.promos).sort((x, y) => (y[1].createdAt || 0) - (x[1].createdAt || 0));
  $("#pres").innerHTML = a.length ? a.map(([c, p]) => `<div class="card"><div class="row"><span class="code">${esc(c)}</span><span class="st ${p.active ? "" : "r"}">${p.active ? "Aktiv" : "Passiv"}</span></div>
  <div class="kv"><span>Məbləğ</span><b>${money(p.amount)} AV</b></div><div class="kv"><span>İstifadə</span><b>${p.used || 0} / ${p.maxUses}</b></div>${p.expiresAt ? `<div class="kv"><span>Bitmə</span><b>${fmtT(p.expiresAt).slice(0, 10)}</b></div>` : ""}
  <div class="acts"><button class="btn sm ghost" data-a="copy" data-c="${esc(c)}">Kopyala</button><button class="btn sm ghost" data-a="tg" data-c="${esc(c)}">${p.active ? "Deaktiv et" : "Aktiv et"}</button><button class="btn sm red" data-a="rm" data-c="${esc(c)}">Sil</button></div></div>`).join("") : '<div class="empty">Hələ promokod yoxdur.</div>';
  $$("#pres [data-a]").forEach(b => b.onclick = async () => {
    const c = b.dataset.c, p = S.promos[c]; if (!p) return;
    try {
      if (b.dataset.a === "copy") { try { await navigator.clipboard.writeText(c); toast("Kopyalandı: " + c); } catch (e) { toast(c); } }
      else if (b.dataset.a === "tg") await update(ref(db, `promo_codes/${c}`), { active: !p.active });
      else if (confirm(c + " kodu silinsin?")) await remove(ref(db, `promo_codes/${c}`));
    } catch (e) { toast("Əməliyyat alınmadı."); }
  });
}

/* ----- Bildiriş / pop-up elan ----- */
function notifyView() {
  main(`<div class="card"><b>Yeni elan / bildiriş</b><form id="nf" class="form" style="margin-top:10px"><label>Başlıq<input id="nt" maxlength="80" required placeholder="Məs: Güncelləmə v1.0"></label>
  <label>Mətn<textarea id="nb" maxlength="1500" required placeholder="Məs:&#10;• Yeni elan səhifəsi&#10;• AV pulu və promokodlar&#10;• Mesajlaşma"></textarea></label>
  <div class="grid2"><label>Növ<select id="nk">${Object.entries(KIND).map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select></label><label>Bitmə tarixi (istəyə görə)<input id="ne" type="date"></label></div>
  <label class="chk"><input type="checkbox" id="np" checked> Sayta girəndə ekranda pop-up kimi göstər</label>
  <label class="chk"><input type="checkbox" id="nr"> Hər girişdə yenidən göstər (bir dəfə əvəzinə)</label>
  <p class="err" id="nerr"></p><div class="grid2"><button type="button" class="btn ghost" id="npv">Önizləmə</button><button class="btn">Dərc et</button></div></form></div><div id="npre"></div><div id="nres" style="display:flex;flex-direction:column;gap:10px"></div>`);
  $("#npv").onclick = () => { $("#npre").innerHTML = prev({ title: $("#nt").value, body: $("#nb").value, kind: $("#nk").value }); };
  $("#nf").onsubmit = async e => {
    e.preventDefault(); const err = $("#nerr"); err.textContent = ""; const d = $("#ne").value;
    try {
      await push(ref(db, "announcements"), { title: $("#nt").value.trim(), body: $("#nb").value.trim(), kind: $("#nk").value, popup: $("#np").checked, repeat: $("#nr").checked, active: true, createdAt: serverTimestamp(), createdBy: S.uid, ...(d ? { expiresAt: new Date(d + "T23:59:59").getTime() } : {}) });
      $("#nf").reset(); $("#np").checked = true; $("#npre").innerHTML = ""; toast("Bildiriş dərc edildi.");
    } catch (er) { err.textContent = "Dərc edilə bilmədi."; }
  };
  notifyRes();
}
const prev = a => `<div class="prev"><div class="h ${esc(a.kind || "info")}"><small>${esc(KIND[a.kind] || "")}</small><br><b>${esc(a.title || "Başlıq")}</b></div><div class="bd">${esc(a.body || "Mətn…")}</div></div>`;
function notifyRes() {
  const a = Object.entries(S.anns).sort((x, y) => (y[1].createdAt || 0) - (x[1].createdAt || 0));
  $("#nres").innerHTML = a.length ? '<div class="meta">Dərc edilənlər</div>' + a.map(([id, n]) => `${prev(n)}<div class="acts" style="margin-top:-2px"><span class="meta" style="align-self:center">${fmtT(n.createdAt)} · ${n.popup === false ? "yalnız bildiriş" : n.repeat ? "pop-up (hər dəfə)" : "pop-up (bir dəfə)"}</span><button class="btn sm ghost" data-a="tg" data-id="${esc(id)}">${n.active === false ? "Aktiv et" : "Deaktiv et"}</button><button class="btn sm red" data-a="rm" data-id="${esc(id)}">Sil</button></div>`).join("") : "";
  $$("#nres [data-a]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, n = S.anns[id]; if (!n) return;
    try { if (b.dataset.a === "tg") await update(ref(db, `announcements/${id}`), { active: n.active === false }); else if (confirm("Silinsin?")) await remove(ref(db, `announcements/${id}`)); } catch (e) { toast("Əməliyyat alınmadı."); }
  });
}

/* ----- Dəstək ----- */
function supView() {
  if (S.tab !== "support") return;
  if (S.view) return chatView(S.view);
  const l = Object.entries(S.sup).map(([id, m]) => ({ id, ...m })).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  main(l.length ? l.map(m => `<button class="card" data-id="${esc(m.id)}"><div class="row"><b>${esc(m.name || m.email || m.id)}${m.unreadAdmin ? '<span class="dot">!</span>' : ""}</b><span class="meta">${fmtT(m.ts)}</span></div><div class="meta">${esc(m.email || "")}${m.phone ? " · " + esc(m.phone) : ""}</div><div style="margin-top:4px;${m.unreadAdmin ? "font-weight:700" : ""}">${esc(m.last || "")}</div></button>`).join("") : '<div class="empty">Hələ söhbət yoxdur.</div>');
  $$("#main .card[data-id]").forEach(b => b.onclick = () => { S.view = b.dataset.id; supView(); });
}
function chatView(uid) {
  const m = S.sup[uid] || {}, u = S.users[uid] || {};
  main(`<button class="back" id="bk">‹ Geri</button><div class="row"><b>${esc(m.name || u.name || uid)}</b><span class="meta">${esc(m.email || u.email || "")}</span></div>${(m.phone || u.phone) ? `<a class="btn ghost" href="tel:${esc(m.phone || u.phone)}">📞 ${esc(m.phone || u.phone)}</a>` : ""}
  <div class="chat" id="chat"></div><form class="cform" id="cf"><input id="ci" maxlength="1000" placeholder="Cavab yazın…" autocomplete="off"><button class="btn">Göndər</button></form>`);
  $("#bk").onclick = () => { if (S.chatUn) { S.chatUn(); S.chatUn = null; } S.view = null; supView(); };
  const chat = $("#chat"); if (S.chatUn) S.chatUn();
  S.chatUn = onValue(query(ref(db, `support/${uid}/messages`), limitToLast(200)), snap => {
    const arr = []; snap.forEach(c => { arr.push(c.val()); });
    chat.innerHTML = arr.map(x => `<div class="msg ${x.from === "admin" ? "a" : "u"}">${esc(x.text)}<small>${fmtT(x.ts)}</small></div>`).join("") || '<div class="empty">Mesaj yoxdur.</div>';
    chat.scrollTop = chat.scrollHeight;
    if (arr.length && arr[arr.length - 1].from === "user") update(ref(db, `support/${uid}/meta`), { unreadAdmin: false }).catch(() => { });
  }, () => toast("Söhbət yüklənmədi."));
  update(ref(db, `support/${uid}/meta`), { unreadAdmin: false }).catch(() => { });
  $("#cf").onsubmit = async e => {
    e.preventDefault(); const t = $("#ci").value.trim(); if (!t) return; $("#ci").value = "";
    try { await push(ref(db, `support/${uid}/messages`), { from: "admin", text: t, ts: serverTimestamp() }); await update(ref(db, `support/${uid}/meta`), { last: t.slice(0, 120), ts: serverTimestamp(), unreadAdmin: false }); }
    catch (er) { toast("Mesaj göndərilmədi."); $("#ci").value = t; }
  };
}

/* ----- Ayarlar ----- */
function settingsView() {
  main(`<div class="card"><b>AV qiymətləri</b><form id="sf" class="form" style="margin-top:10px"><div class="grid2"><label>Önə çıxarma qiyməti (AV)<input id="sc" type="number" step="0.01" min="0" required value="${esc(S.cfg.boostCost ?? 3)}"></label><label>Müddət (gün)<input id="sd" type="number" step="1" min="1" max="30" required value="${esc(S.cfg.boostDays ?? 3)}"></label></div><p class="err" id="serr"></p><button class="btn">Yadda saxla</button></form></div>
  <div class="card"><b>Qeyd</b><p class="meta">Dəyişiklik dərhal bütün istifadəçilərə tətbiq olunur. İstifadəçi elanı önə çıxaranda balansından bu məbləğ çıxılır.</p></div>`);
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const c = parseFloat($("#sc").value), d = parseInt($("#sd").value, 10);
    if (!(c >= 0) || !(d >= 1)) { $("#serr").textContent = "Dəyərləri düzgün yazın."; return; }
    try { await set(ref(db, "config"), { boostCost: c, boostDays: d }); toast("Ayarlar yadda saxlanıldı."); } catch (er) { $("#serr").textContent = "Yadda saxlanılmadı."; }
  };
}
</script>
</body>
</html>
